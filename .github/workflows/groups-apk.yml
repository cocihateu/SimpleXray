name: Build LucX APK

on:
  push:
    branches: [LucX]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            21
            25

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.9.1

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 16111833
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android build tools
        run: |
          ndk_version="$(sed -n 's/^NDK_VERSION=//p' version.properties | tr -d '\r')"
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          android --sdk "$SDK_ROOT" sdk install "build-tools/36.0.0"
          android --sdk "$SDK_ROOT" sdk install "platforms/android-37.2"
          android --sdk "$SDK_ROOT" sdk install "ndk/$ndk_version"
          android --sdk "$SDK_ROOT" sdk install "cmake/3.22.1"

      - name: Prepare arm64 Xray and bundled routing data
        run: |
          version="$(sed -n 's/^XRAY_CORE_VERSION=//p' version.properties | tr -d '\r')"
          zip="$RUNNER_TEMP/xray-android.zip"
          curl -fsSL "https://github.com/XTLS/Xray-core/releases/download/$version/Xray-android-arm64-v8a.zip" -o "$zip"
          mkdir -p third_party/xray-prebuilt/arm64-v8a
          unzip -p "$zip" xray > third_party/xray-prebuilt/arm64-v8a/libxray.so
          chmod +x third_party/xray-prebuilt/arm64-v8a/libxray.so
          curl -fsSL https://github.com/XTLS/Xray-rules-dat/releases/latest/download/geoip-lite.dat -o app/src/main/assets/geoip.dat
          curl -fsSL https://github.com/XTLS/Xray-rules-dat/releases/latest/download/geosite.dat -o app/src/main/assets/geosite.dat
          zashboard_tmp="$(mktemp -d "$RUNNER_TEMP/zashboard.XXXXXX")"
          curl -fsSL --retry 3 https://github.com/Zephyruso/zashboard/releases/download/v3.30.0/dist.zip -o "$zashboard_tmp/dist.zip"
          unzip -q "$zashboard_tmp/dist.zip" -d "$zashboard_tmp/unpacked"
          test -f "$zashboard_tmp/unpacked/dist/index.html"
          test -f "$zashboard_tmp/unpacked/dist/THIRD_PARTY_NOTICES.md"
          rm -rf app/src/main/assets/zashboard
          mv "$zashboard_tmp/unpacked/dist" app/src/main/assets/zashboard
          rm -rf "$zashboard_tmp"

      - name: Build SimpleTUN for Android
        working-directory: third_party/simpletun
        run: zig build android

      - name: Load persistent Groups signing key
        env:
          GROUPS_KEYSTORE_BASE64: ${{ secrets.GROUPS_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$GROUPS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/simplexray-groups.p12"

      - name: Assemble signed debug APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/simplexray-groups.p12
          KEYSTORE_PASSWORD: ${{ secrets.GROUPS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: simplexray-groups
          KEY_PASSWORD: ${{ secrets.GROUPS_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LucX-arm64-v8a
          path: app/build/outputs/apk/debug/LucX-arm64-v8a.apk
          if-no-files-found: error
